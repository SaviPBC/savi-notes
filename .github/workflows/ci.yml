name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - run: uv sync --python 3.13
      - name: Engine and CLI
        shell: bash
        run: |
          mkdir vault
          printf -- '---\ntags: [ci]\n---\nHello from CI.\n' > "vault/CI note.md"
          uv run python -c "from savi_notes import config; c = config.load(); c.update(vault='$PWD/vault', semantic=False, sync=False); config.save(c)"
          uv run savi-notes search hello | grep "CI note"
          uv run savi-notes tags | grep ci
          uv run savi-notes check
          uv run savi-notes format | grep "Callout"
          uv run savi-notes skill
      - name: Boot the app headless
        run: uv run python scripts/boot_test.py
      - run: uv build
