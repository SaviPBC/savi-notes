[project]
name = "savi-notes"
version = "0.1.0"
description = "Markdown notes organised by tags, with search, splits and a Claude Code skill"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "numpy>=1.26",
  "send2trash>=1.8",
  "platformdirs>=4",
  "ziamath>=0.12",
]

[project.scripts]
savi-notes = "savi_notes.cli:main"

# The same app without a console window, for the Start Menu shortcut.
[project.gui-scripts]
savi-notes-app = "savi_notes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savi_notes"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]
